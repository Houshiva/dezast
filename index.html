  <style>
    @font-face { font-family: "Vazirmatn"; src: url("assets/fonts/Vazirmatn-Light.woff2") format("woff2"); font-weight: 300; font-display: swap; }
    @font-face { font-family: "Vazirmatn"; src: url("assets/fonts/Vazirmatn-Medium.woff2") format("woff2"); font-weight: 500; font-display: swap; }
    @font-face { font-family: "Vazirmatn"; src: url("assets/fonts/Vazirmatn-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }

    :root {
      --red: #770e12;
      --red-deep: #4a070a;
      --gold: #eed991;
      --gold-soft: rgba(238, 217, 145, .62);
      --gold-text: rgba(238, 217, 145, .8);
      --ease: cubic-bezier(.22, .61, .36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--red);
      color: var(--gold);
      font-family: "Vazirmatn", Tahoma, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* depth: soft vignette + static grain tile (no blend modes, cheap to composite) */
    /* exactly one screen tall, never more: if space runs short the logo shrinks, nothing scrolls */
    .stage {
      position: relative;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto auto;
      justify-items: center;
      padding: 32px 0 max(24px, env(safe-area-inset-bottom));
      background:
        url("assets/grain.png"),
        radial-gradient(ellipse 70% 60% at 50% 42%, rgba(255, 190, 150, .07), transparent 70%),
        radial-gradient(ellipse 120% 90% at 50% 50%, transparent 45%, var(--red-deep) 120%);
    }
    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      background: var(--red-deep);
      opacity: 0;
      pointer-events: none;
    }

    .center {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      min-height: 0;
      height: 100%;
      text-align: center;
      padding: 0 16px clamp(20px, 4vh, 40px);
    }

    /* logo: revealed the way «است» is written, top-right to bottom-left, then breathes */
    .center h1 { display: flex; justify-content: center; min-height: 0; flex: 0 1 auto; }
    .logo {
      display: block;
      width: min(400px, 58vw, 35vh);
      height: auto;
      min-height: 0;
      object-fit: contain;
      -webkit-mask-image: linear-gradient(225deg, #000 40%, transparent 60%);
              mask-image: linear-gradient(225deg, #000 40%, transparent 60%);
      -webkit-mask-size: 300% 300%;
              mask-size: 300% 300%;
      -webkit-mask-position: 0 100%;
              mask-position: 0 100%;
      filter: drop-shadow(0 0 28px rgba(238, 217, 145, .2));
      animation:
        draw 1.2s var(--ease) .1s forwards,
        breathe 7s ease-in-out 1.4s infinite;
    }
    @keyframes draw {
      to { -webkit-mask-position: 100% 0; mask-position: 100% 0; }
    }
    @keyframes breathe {
      50% { transform: translateY(-6px); }
    }

    .slogan {
      margin-top: clamp(24px, 5vh, 48px);
      font-size: clamp(1.55rem, 5.2vw, 2.6rem);
      font-weight: 300;
      line-height: 1.6;
      color: var(--gold-soft);
    }
    .slogan span {
      display: inline-block;
      opacity: 0;
      transform: translateY(12px);
      animation: rise .8s var(--ease) forwards;
    }
    .slogan .w1 { animation-delay: .7s; }
    .slogan .w2 { animation-delay: .82s; }
    .slogan .w3 { animation-delay: .94s; }
    .slogan .w4 { animation-delay: 1.06s; }
    .slogan .w5 { animation-delay: 1.18s; }
    .slogan .ast {
      color: var(--gold);
      font-weight: 700;
      animation-delay: 1.45s;
    }
    @keyframes rise { to { opacity: 1; transform: none; } }
    @keyframes fade { to { opacity: 1; } }

    /* old Dezful bridge: its own row, so it never meets the slogan;
       height never drops below width/10 (the drawing's ratio), so slice only crops the sides */
    .bridge {
      display: block;
      width: 100%;
      height: max(clamp(110px, min(34vh, 40vw), 340px), 10vw);
      pointer-events: none;
      -webkit-mask-image: linear-gradient(to right, transparent, #000 18%, #000 82%, transparent);
              mask-image: linear-gradient(to right, transparent, #000 18%, #000 82%, transparent);
    }
    .bridge path {
      fill: none;
      stroke: var(--gold);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    /* drawn right to left; the script staggers each piece by its position on screen.
       Without the script everything draws at once from 1.8s. */
    .b-lines { opacity: 0; animation: reveal .01s linear 1.8s forwards; }
    .b-lines path {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: line 1.6s var(--ease) 1.8s forwards;
    }
    .b-water { opacity: 0; animation: water 1.5s ease 3.2s forwards; }
    /* a spark that walks the bridge: along the base, up and over each arch, on to the next */
    .bridge .b-trace path {
      stroke-dasharray: .012 2;
      stroke-dashoffset: .012;
      animation: trace 7.5s linear 3.9s infinite;
    }
    .bridge .t-core { stroke-width: 2.2; }
    .bridge .t-halo { stroke-width: 8; opacity: .22; }
    @keyframes trace { to { stroke-dashoffset: -1; } }
    @keyframes reveal { to { opacity: .4; } }
    @keyframes line { to { stroke-dashoffset: 0; } }
    @keyframes water { to { opacity: .22; } }

    footer {
      position: relative;
      z-index: 1;
      margin-top: 14px;
      padding: 0 16px;
      display: flex;
      justify-content: center;
      gap: 14px;
      font-size: .82rem;
      font-weight: 500;
      color: var(--gold-text);
      opacity: 0;
      animation: fade 1s ease 2.2s forwards;
    }
    footer .dot { opacity: .5; }
    footer .domain {
      direction: ltr;
      letter-spacing: .14em;
    }

    /* portrait (phones): centre logo + slogan + bridge as one group instead of
       pinning it to the bottom, so the top of the screen isn't left empty */
    @media (orientation: portrait) {
      .stage { grid-template-rows: minmax(0, 1fr) auto auto minmax(0, 1.25fr); }
      .center { grid-row: 2; height: auto; }
      .bridge { grid-row: 3; }
      footer { grid-row: 4; align-self: end; }
      .logo { width: min(320px, 64vw, 30vh); }
    }

    /* very short landscape screens (phone on its side): tighter bridge and slogan so the logo keeps room */
    @media (orientation: landscape) and (max-height: 500px) {
      .stage { padding-top: 16px; }
      .bridge { height: max(24vh, 10vw); }
      .slogan { margin-top: 10px; font-size: clamp(1.2rem, 6.5vh, 2rem); }
      footer { margin-top: 8px; }
    }

    /* ---- the film: fly through the logo, then rebuild (classes set by the script) ---- */
    .stage.reset, .stage.reset *, .stage.reset::after { animation: none !important; }
    .stage.replay::after { animation: lift .9s ease forwards; }
    .stage.fly::after { animation: dim 1.1s ease forwards; }
    .stage.fly .logo {
      -webkit-mask-image: none;
              mask-image: none;
      transform-origin: 50% 52%;
      animation: through 1.3s cubic-bezier(.6, 0, .9, .45) forwards;
    }
    .stage.fly .slogan,
    .stage.fly .bridge,
    .stage.fly footer { animation: away .7s ease forwards; }
    .stage.ready .logo { cursor: pointer; }
    @keyframes through {
      0%   { transform: scale(1); opacity: 1; }
      65%  { opacity: 1; }
      100% { transform: scale(11); opacity: 0; }
    }
    @keyframes away { from { opacity: 1; } to { opacity: 0; transform: scale(.94); } }
    @keyframes dim  { to { opacity: .85; } }
    @keyframes lift { from { opacity: .85; } to { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .logo, .slogan span, footer { animation: none; opacity: 1; transform: none; }
      .logo { -webkit-mask-image: none; mask-image: none; }
      .b-lines { animation: none; opacity: .4; }
      .b-lines path { animation: none; stroke-dashoffset: 0; }
      .b-water { animation: none; opacity: .22; }
      .b-trace { display: none; }
    }
  </style>
</head>

  <script>
    // Choreography that depends on screen width (the bridge drawing is wider than any screen):
    // the bridge draws right to left across the visible part in SPAN seconds, and the spark
    // enters at the visible right edge the moment the drawing finishes.
    (function () {
      var START = 1.8, SPAN = 1.6, PIECE = 0.5, SPARK = 7.5;
      var svg = document.querySelector(".bridge");
      if (!svg || !svg.getScreenCTM) return;
      var ctm = svg.getScreenCTM();
      if (!ctm) return;
      var toUnits = function (px) { return (px - ctm.e) / ctm.a; };
      var right = toUnits(window.innerWidth * 0.92), left = toUnits(window.innerWidth * 0.08);
      var width = right - left, speed = width / SPAN;

      svg.querySelectorAll(".b-lines path").forEach(function (p) {
        var box = p.getBBox(), edge = box.x + box.width, s = p.style;
        if (box.width > width) {
          // long deck / base lines: one steady pen, in step with the pieces below
          s.animationTimingFunction = "linear";
          s.animationDuration = box.width / speed + "s";
          s.animationDelay = START - (edge - right) / speed + "s";
        } else {
          var t = Math.min(Math.max((right - edge) / width, 0), 1);
          s.animationDuration = PIECE + "s";
          s.animationDelay = START + t * SPAN + "s";
        }
      });

      var core = svg.querySelector(".t-core");
      var total = core.getTotalLength(), at = 0;
      while (at < total && core.getPointAtLength(at).x > right) at += 10;
      var delay = START + SPAN + PIECE - (at / total) * SPARK;
      svg.querySelectorAll(".b-trace path").forEach(function (p) {
        p.style.animationDuration = SPARK + "s";
        p.style.animationDelay = delay + "s";
      });

      // The film: once the spark has crossed the visible arches the first time, fly through the
      // logo, pause on dark red, rebuild everything and stay. Tapping the logo plays it again.
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var FLY = 1.3, PAUSE = 0.5;
      var stage = document.querySelector(".stage"), logo = document.querySelector(".logo");
      while (at < total && core.getPointAtLength(at).x > left) at += 10;
      var firstPass = delay + (at / total) * SPARK + 0.2;
      var busy = true;

      function fly() {
        busy = true;
        stage.classList.remove("ready");
        stage.classList.add("fly");
        setTimeout(rebuild, (FLY + PAUSE) * 1000);
      }
      function rebuild() {
        stage.classList.add("reset");           // drop every animation...
        stage.classList.remove("fly");
        void stage.offsetWidth;                 // ...let the browser notice...
        stage.classList.remove("reset");        // ...and start them all again from zero
        stage.classList.add("replay");
        setTimeout(function () { busy = false; stage.classList.add("ready"); }, firstPass * 1000);
      }
      setTimeout(fly, firstPass * 1000);
      logo.addEventListener("click", function () { if (!busy) fly(); });
    })();
  </script>
</body>
</html>
